# Serves the built Angular application and proxies the API to the engine.
#
# Same-origin by design: the browser talks only to this server, so there is no CORS configuration to
# get wrong and no need to expose the engine directly. The engine's administrative endpoints stay
# behind whatever authenticates this server.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles are immutable, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading bundles that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://workflow-engine:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A plugin JAR that bundles its dependencies is easily tens of megabytes, and the engine accepts
        # up to 64 MB. A default 1 MB limit here would reject the upload before it reached the engine.
        client_max_body_size 80m;
        proxy_request_buffering off;

        # A synchronous workflow execution can legitimately take minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /actuator/ {
        proxy_pass http://workflow-engine:8080;
        proxy_set_header Host $host;
    }

    # Client-side routing: any unknown path is an Angular route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Minimal hardening. A real deployment should add a Content-Security-Policy; it is left out here
    # rather than guessed, because it depends on where this is hosted.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
